<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的静态网页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    min-height:100vh;
    background-image:url("https://pic.616pic.com/ys_bnew_img/00/24/47/Y4QvLm3W2O.jpg");
    background-size:cover;
    background-position:left center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    font-family:"Microsoft YaHei",sans-serif;
    padding:80px 60px;
    position:relative;
}
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom,rgba(0,0,0,0)40%,rgba(0,0,0,0.35)100%);
    pointer-events:none;
    z-index:0;
}
.content{position:relative;z-index:1;}
h1{
    font-size:52px;
    margin-bottom:20px;
    color:#ff7a1a;
    text-shadow:1px 1px 2px #000000, 0 0 6px rgba(180,20,0,0.4);
}
p{
    font-size:24px;
    margin-bottom:14px;
    color:#ffbc69;
    text-shadow:1px 1px 2px #000000, 0 0 4px rgba(180,20,0,0.3);
}
</style>
</head>
<body>
    <div class="content">
        <h1>教你成为国一火男</h1>
        <p>成为赋能哥的必要之路</p>
        <p>姓名：李康博</p>
        <p>学籍：山东师范大学</p>
    </div>
</body>
</html>
